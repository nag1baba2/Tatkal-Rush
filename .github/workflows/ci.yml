name: CI

on:
  push:
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The backend tests need real Postgres and Redis, and some talk to a live API
  # (tests/test_concurrency.py skips itself if it cannot reach one). So CI does what a
  # developer does: bring up the docker compose stack, then run pytest inside the api container.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack (postgres, redis, api, worker, beat)
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Backend tests
        run: docker compose exec -T api pytest -q

      - name: Models and migrations agree (no schema drift)
        run: docker compose exec -T api alembic check

      - name: Show service logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  # A small end-to-end run of the real load test: 20 simulated users fight over 10 seats and the
  # invariant checker judges the result. It is a smoke test, not a benchmark: shared CI runners are
  # too noisy for performance numbers, so nothing here is recorded as a result. The full 1,000-user
  # scenarios are run by hand (see README, "Load tests and the invariant checker").
  load-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run the smoke scenario (fails if any invariant check fails)
        run: bash loadtest/run_scenario.sh ci-smoke 20 10 120 off 1 10 1

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-reports
          path: |
            loadtest/data/ci-smoke*.json
            loadtest/data/ci-smoke*.txt
          if-no-files-found: warn

      - name: Show service logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose down -v
